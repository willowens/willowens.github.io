<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>chess</title>
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="./chess.css">
    <link rel="icon" type="image/ico" href="../images/favicon.ico">
    <link rel="stylesheet"
          href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
          integrity="sha384-q94+BZtLrkL1/ohfjR8c6L+A6qzNH9R2hBLwyoAfu3i/WCvQjzL2RQJ3uNHDISdU"
          crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
            integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"
            integrity="sha384-8Vi8VHwn3vjQ9eUHUxex3JSN/NFqUg3QbPyX8kWyb93+8AC/pPWTzj+nHtbC5bxD"
            crossorigin="anonymous"></script>
    <script type="module" src="./chess.js"></script>
</head>
<body>
    <header class="page-header">
        <div class="header-main">
            <div class="header-left">
                <nav class="page-nav">
                    <a href="/">/home</a>
                    <a href="/projects">/projects</a>
                    <a href="/books">/books</a>
                </nav>
                <h1>i play alot of chess</h1>
                <h3>im not good, but i have fun</h3>
                <h3>here is the last game i played</h3>
            </div>
            <div class="header-right">
                <div class="chess-ratings">
                    <div class="chess-ratings-title">chess ratings</div>
                    <div class="chess-ratings-list">
                        <span class="rapid-rating"></span>
                        <span class="blitz-rating"></span>
                        <span class="bullet-rating"></span>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="chess-container">
            <div class="board-section">
                <div id="board" style="width: 400px"></div>
                <div class="chess-controls">
                    <button class="prev-btn btn">&lt; Prev</button>
                    <button class="reset-btn btn">Reset</button>
                    <button class="next-btn btn">Next &gt;</button>
                </div>
            </div>
            <div class="move-list-container">
                <h3>Move List</h3>
                <div class="move-list"></div>
            </div>
        </main>
</body>
</html>
